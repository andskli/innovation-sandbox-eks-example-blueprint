version: 0.2

env:
  variables:
    TF_VERSION: "1.12.0"

phases:
  install:
    commands:
      - curl -sLO "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -q terraform_${TF_VERSION}_linux_amd64.zip -d /usr/local/bin

  build:
    commands:
      - cd terraform
      - terraform init -backend-config="bucket=${STATE_BUCKET}" -backend-config="region=${AWS_REGION}"
      - terraform destroy -auto-approve -var="region=${AWS_REGION}" -var="deploy_id=${DEPLOY_ID}"

  post_build:
    commands:
      - echo "Cluster teardown complete"
      - aws s3 rm "s3://${STATE_BUCKET}/state/" --recursive
